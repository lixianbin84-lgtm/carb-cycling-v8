<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BENLEE 碳循环餐单规划 V8</title>
<style>
:root{
  --bg:#f5f5f3;--sur:#fff;--sur2:#f0f0ee;
  --bd:#e2e2de;--bd2:#c0c0bc;
  --tx:#1a1a18;--tx2:#686864;--tx3:#a8a8a4;
  --hi:#1a9e6e;--hi-bg:#e6f7f1;--hi-bd:#8ed4b8;
  --mi:#2f7ed4;--mi-bg:#e8f2fc;--mi-bd:#8ec4f0;
  --lo:#d4572f;--lo-bg:#fdeee9;--lo-bd:#f0a898;
  --acc:#1a9e6e;--red:#d93030;
  --warn-bg:#fff8e6;--warn-bd:#e8c840;--warn-tx:#7a5800;
  --app-header-height:44px;
  --r:10px;--rs:6px;
  font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;
  font-size:14px;color:var(--tx);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;}
.app{max-width:460px;margin:0 auto;padding:12px 12px 72px;}

.hd{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;margin:0 -12px 12px;padding:12px 12px 10px;background:rgba(245,245,243,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(226,226,222,.7);}
.hd-t{font-size:18px;font-weight:700;letter-spacing:0;}
.hd-t em{color:var(--acc);font-style:normal;}
.ver{font-size:10px;color:var(--acc);border:1px solid var(--hi-bd);background:var(--hi-bg);border-radius:999px;padding:2px 6px;margin-left:6px;vertical-align:2px;}
.btn-g{font-size:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--bd2);background:var(--sur);color:var(--tx2);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.btn-g:hover{border-color:var(--acc);color:var(--acc);}

.setup{background:var(--sur);border:1px solid rgba(226,226,222,.9);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.05);}
.slbl{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.ff{display:flex;flex-direction:column;gap:3px;}
.ff label{font-size:11px;color:var(--tx2);}
.ff input,.ff select{height:38px;padding:7px 9px;border:1px solid var(--bd);border-radius:10px;font-size:14px;background:var(--sur);color:var(--tx);outline:none;width:100%;}
.ff input:focus,.ff select:focus{border-color:var(--acc);}
.btn-calc{width:100%;height:42px;padding:8px;background:var(--acc);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(26,158,110,.20);}
.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px;}
.prof{display:grid;grid-template-columns:1fr 34px;gap:4px;min-width:0;}
.prof-use,.prof-save{height:32px;border-radius:10px;border:1px solid var(--bd);background:var(--sur);color:var(--tx2);font-size:12px;cursor:pointer;min-width:0;}
.prof-use{padding:0 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prof-use.on{border-color:var(--acc);background:var(--hi-bg);color:var(--acc);font-weight:700;}
.prof-save{font-weight:700;color:var(--acc);}
.prof-use:hover,.prof-save:hover{border-color:var(--acc);}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px;}
.spc{background:var(--sur2);border-radius:12px;padding:8px 5px;text-align:center;}
.spc .v{font-size:15px;font-weight:700;}
.spc .l{font-size:10px;color:var(--tx2);}
.science-note{margin-top:9px;padding:8px 10px;border-radius:10px;background:#f7faf8;color:var(--tx2);font-size:11px;line-height:1.5;border:1px solid #dcebe4;}

.sec{font-size:12px;font-weight:700;color:var(--tx2);letter-spacing:0;margin:14px 2px 8px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.today-jump{border:1px solid var(--bd);background:var(--sur);color:var(--acc);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;}
.dc{background:var(--sur);border:1.5px solid var(--bd);border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;position:relative;user-select:none;min-height:76px;box-shadow:0 2px 8px rgba(0,0,0,.03);}
.dc.sel{box-shadow:0 0 0 2.5px var(--acc);}
.dc.H{border-color:var(--hi-bd);background:var(--hi-bg);}
.dc.M{border-color:var(--mi-bd);background:var(--mi-bg);}
.dc.L{border-color:var(--lo-bd);background:var(--lo-bg);}
.dc-day{font-size:10px;color:var(--tx2);margin-bottom:2px;}
.dc-lbl{font-size:11px;font-weight:600;}
.lH{color:var(--hi);}.lM{color:var(--mi);}.lL{color:var(--lo);}
.dc-k{font-size:9px;color:var(--tx3);margin-top:1px;}
.dc-mode{font-size:9px;color:var(--tx2);margin-top:1px;}
.dc-s{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:8px;background:#1a1a18;color:#fff;border-radius:999px;padding:1px 5px;white-space:nowrap;}

.srow{display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:8px;margin-bottom:10px;padding:10px;background:var(--sur);border:1px solid var(--bd);border-radius:14px;font-size:12px;color:var(--tx2);}
.ssel{height:34px;padding:5px 8px;border:1px solid var(--bd);border-radius:10px;font-size:13px;background:var(--sur);outline:none;min-width:0;}
.hint{grid-column:1/-1;font-size:11px;color:var(--tx3);line-height:1.4;}

.det{background:var(--sur);border:1px solid rgba(226,226,222,.9);border-radius:18px;overflow:visible;box-shadow:0 8px 24px rgba(0,0,0,.05);}
.day-sticky{position:sticky;top:var(--app-header-height);z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px 18px 0 0;}
.dh{padding:11px 14px 6px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;border-radius:18px 18px 0 0;}
.dt{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.macro-sticky{padding:9px 14px;border-bottom:1px solid var(--bd);}
.dbs{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;}
.today-strip{padding:0 14px 9px;text-align:center;font-size:11px;color:var(--tx2);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--bd);}
.mb{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:500;border:1.5px solid transparent;}
.mb-ok  {background:#e6f7f1;color:#0d7a54;border-color:#8ed4b8;}
.mb-warn{background:#fff8e6;color:#8a6000;border-color:#e8c840;}
.mb-over{background:#fdeee9;color:#c0300a;border-color:#f0a898;}
.mb-ref {background:#f3f3f1;color:#686864;border-color:#d8d8d4;}
.mb sub{font-size:9px;opacity:.7;font-weight:400;}
.meal-actions{display:flex;gap:5px;flex-wrap:wrap;}
.btn-auto{height:28px;padding:4px 10px;border:1px solid var(--hi-bd);border-radius:999px;background:var(--hi-bg);color:var(--acc);font-size:12px;font-weight:700;cursor:pointer;}
.btn-auto:hover{border-color:var(--acc);}

.coach-card{margin:12px 14px 0;padding:13px;border:1px solid var(--bd);border-radius:16px;background:linear-gradient(135deg,#f8fffb 0%,#fff 58%,#f7faff 100%);box-shadow:0 5px 16px rgba(20,80,56,.06);}
.coach-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.coach-title{font-size:14px;font-weight:800;}
.coach-tag{font-size:11px;color:var(--acc);background:var(--hi-bg);border:1px solid var(--hi-bd);border-radius:999px;padding:3px 8px;white-space:nowrap;}
.coach-body{display:grid;grid-template-columns:92px 1fr;gap:13px;align-items:center;}
.fuel-ring{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
.fuel-ring::after{content:'';width:58px;height:58px;border-radius:50%;background:var(--sur);position:absolute;box-shadow:0 1px 5px rgba(0,0,0,.06);}
.fuel-center{position:relative;z-index:1;text-align:center;line-height:1.05;}
.fuel-center strong{display:block;font-size:16px;}
.fuel-center span{font-size:9px;color:var(--tx3);}
.coach-main{min-width:0;display:flex;flex-direction:column;gap:7px;}
.coach-line{display:grid;grid-template-columns:58px 1fr;gap:7px;align-items:start;font-size:12px;line-height:1.5;color:var(--tx2);}
.coach-line strong{color:var(--tx);font-size:12px;}
.coach-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px;}
.coach-chip{font-size:11px;padding:3px 7px;border-radius:999px;background:var(--sur2);color:var(--tx2);border:1px solid var(--bd);}
.macro-legend{display:flex;justify-content:center;gap:7px;margin-top:9px;font-size:9px;color:var(--tx3);}
.legend-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:1px;}

.pantry{padding:12px 14px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#fff,#fafaf8);}
.pantry-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;}
.pantry-picked{min-height:38px;border:1px solid var(--bd);border-radius:12px;background:var(--sur);padding:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.pantry-empty{font-size:12px;color:var(--tx3);padding-left:4px;}
.food-chip{font-size:11px;color:var(--acc);background:var(--hi-bg);border:1px solid var(--hi-bd);border-radius:999px;padding:3px 7px;white-space:nowrap;}
.pantry-btn{height:38px;padding:0 12px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.pantry-btn.sec{background:var(--sur);color:var(--acc);border:1px solid var(--hi-bd);}
.pantry-help{font-size:11px;color:var(--tx3);line-height:1.45;margin-top:7px;}
.food-pick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:56vh;overflow-y:auto;margin-bottom:12px;}
.food-pick{min-height:34px;text-align:left;padding:7px 9px;border:1px solid var(--bd);border-radius:10px;background:var(--sur2);color:var(--tx);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.food-pick.good{border-color:var(--hi-bd);background:var(--hi-bg);}
.food-pick.caution{border-color:var(--warn-bd);background:var(--warn-bg);}
.food-pick.avoid{border-color:var(--lo-bd);background:var(--lo-bg);}
.food-pick-badge{margin-left:auto;font-size:10px;font-weight:700;white-space:nowrap;}
.food-pick.good .food-pick-badge{color:var(--hi);}
.food-pick.caution .food-pick-badge{color:var(--warn-tx);}
.food-pick.avoid .food-pick-badge{color:var(--lo);}
.food-pick.on{border-color:#d91f4c;background:#fff1f4;color:#b7153d;font-weight:900;box-shadow:0 0 0 3px rgba(217,31,76,.28),0 5px 14px rgba(217,31,76,.18);}
.food-pick.on .food-pick-dot{background:#fff!important;}
.food-pick.on .food-pick-badge{color:#b7153d;}
.food-pick.on::before{content:'✓';width:18px;height:18px;border-radius:50%;background:#d91f4c;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.food-pick-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

.meals{padding:12px 14px;display:flex;flex-direction:column;gap:16px;}
.meal-ttl{font-size:12px;font-weight:600;color:var(--tx2);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.meal-sub{font-weight:400;color:var(--tx3);font-size:11px;}

.food-rows{display:flex;flex-direction:column;gap:6px;}
.food-row{display:grid;grid-template-columns:8px minmax(80px,1fr) 24px 54px 24px 16px minmax(42px,auto) 28px 28px;align-items:center;gap:5px;background:var(--sur2);border-radius:12px;padding:7px 8px;}
.food-row.is-locked{background:var(--warn-bg);}
.fdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

.fname{
  min-width:0;width:auto;flex-shrink:1;
  font-size:13px;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;background:var(--sur);
  border:1px solid var(--bd);border-radius:4px;padding:3px 5px;
}
.fname:hover{border-color:var(--acc);color:var(--acc);}
.fname::after{content:' ▾';font-size:9px;color:var(--tx3);}

/* ── 克重框：56px，刚好显示3位数 ── */
.gram{
  width:56px !important;
  max-width:56px !important;
  min-width:56px !important;
  flex-shrink:0;flex-grow:0;
  height:30px;padding:3px 6px;
  border:1px solid var(--bd);border-radius:8px;
  font-size:13px;text-align:right;
  background:var(--sur);color:var(--tx);
  box-sizing:border-box;
}
.gram:focus{outline:none;border-color:var(--acc);}
.gram.lk{background:var(--warn-bg);border-color:var(--warn-bd);}

.gunit{width:16px;flex-shrink:0;font-size:11px;color:var(--tx3);}
.step{
  width:24px;height:30px;flex-shrink:0;
  border:1px solid var(--bd);border-radius:8px;
  background:var(--sur);color:var(--tx2);
  font-size:14px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;
}
.step:hover{border-color:var(--acc);color:var(--acc);}
.adj{
  min-width:42px;flex-shrink:0;
  font-size:10px;font-weight:600;color:var(--tx3);
  white-space:nowrap;
}
.adj.add{color:var(--acc);}
.adj.cut{color:var(--red);}
.raw-tag{font-size:9px;color:var(--tx3);background:var(--sur);border:1px solid var(--bd);border-radius:3px;padding:1px 4px;flex-shrink:0;white-space:nowrap;}

.ib{width:28px;height:30px;flex-shrink:0;border:1px solid var(--bd);border-radius:8px;background:var(--sur);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0;}
.ib:hover{border-color:var(--bd2);}
.ib.ilk{background:var(--warn-bg);border-color:var(--warn-bd);}
.ib.idl:hover{border-color:var(--red);color:var(--red);}

.add-row{margin-top:5px;}
.btn-add{padding:7px 14px;border:1px dashed var(--bd2);border-radius:999px;background:var(--sur);color:var(--tx3);font-size:12px;cursor:pointer;}
.btn-add:hover{border-color:var(--acc);color:var(--acc);}

.gap-notice{margin-top:5px;padding:7px 10px;background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:var(--rs);font-size:12px;color:var(--warn-tx);line-height:1.6;}
.gap-notice strong{font-weight:600;}

.picker{position:fixed;background:var(--sur);border:1px solid var(--bd2);border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:999;min-width:150px;max-height:240px;overflow-y:auto;padding:4px 0;display:none;}
.picker.open{display:block;}
.p-item{padding:7px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;}
.p-item:hover{background:var(--sur2);}
.p-item.cur{color:var(--acc);font-weight:500;}
.p-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.p-raw{font-size:10px;color:var(--tx3);}

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:200;align-items:center;justify-content:center;}
.ov.open{display:flex;}
.modal{background:var(--sur);border-radius:var(--r);padding:18px;width:min(320px,92vw);}
.modal.wide{width:min(440px,94vw);max-height:88vh;overflow-y:auto;}
.m-ttl{font-size:14px;font-weight:600;margin-bottom:12px;}
.mf{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;}
.mf label{font-size:11px;color:var(--tx2);}
.mf select,.mf input{padding:7px 9px;border:1px solid var(--bd);border-radius:var(--rs);font-size:13px;width:100%;outline:none;}
.mf select:focus,.mf input:focus{border-color:var(--acc);}
.mprev{font-size:12px;color:var(--tx2);margin-bottom:12px;padding:7px 9px;background:var(--sur2);border-radius:var(--rs);}
.mbtns{display:flex;gap:7px;}
.bsec{flex:1;padding:8px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--sur);color:var(--tx2);font-size:13px;cursor:pointer;}
.bpri{flex:1;padding:8px;border:none;border-radius:var(--rs);background:var(--acc);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
.tpl-grid{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow-y:auto;margin-bottom:12px;}
.tpl-sec{display:flex;flex-direction:column;gap:6px;}
.tpl-title{font-size:11px;font-weight:700;color:var(--tx3);}
.tpl-btn{width:100%;min-height:36px;text-align:left;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--sur2);color:var(--tx);font-size:13px;cursor:pointer;}
.tpl-btn:hover{border-color:var(--acc);color:var(--acc);}
.tpl-btn.empty{color:var(--tx3);background:var(--sur);border-style:dashed;cursor:default;}
.smart-food-intro{padding:10px 11px;margin-bottom:10px;border:1px solid var(--hi-bd);border-radius:12px;background:var(--hi-bg);color:var(--tx2);font-size:11px;line-height:1.55;}
.smart-food-intro strong{display:block;margin-bottom:2px;color:var(--acc);font-size:13px;}
.smart-food-or{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--tx3);font-size:10px;}
.smart-food-or::before,.smart-food-or::after{content:"";height:1px;flex:1;background:var(--bd);}
.smart-manual-link{display:block;width:100%;margin-top:8px;padding:7px;border:0;background:transparent;color:var(--tx3);font-size:11px;text-decoration:underline;cursor:pointer;}
.smart-photo-help{margin-top:5px;color:var(--tx3);font-size:10px;line-height:1.45;text-align:center;}
.food-form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.food-form-grid .wide-field{grid-column:1/-1;}
.food-form-help{font-size:11px;color:var(--tx3);line-height:1.5;margin:8px 0;}
.food-hub-actions{display:flex;gap:7px;margin-top:11px;}
.food-library-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:15px 0 7px;padding-top:12px;border-top:1px solid var(--bd);}
.food-library-title{font-size:12px;font-weight:700;color:var(--tx2);}
.food-library-tools{display:flex;gap:5px;}
.mini-btn{border:1px solid var(--bd);background:var(--sur);color:var(--tx2);border-radius:8px;padding:5px 7px;font-size:10px;cursor:pointer;}
.custom-food-list{display:flex;flex-direction:column;gap:6px;}
.custom-food-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--sur2);border-radius:10px;padding:8px 9px;}
.custom-food-main{min-width:0;}
.custom-food-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.custom-food-meta{font-size:10px;color:var(--tx3);margin-top:2px;}
.custom-food-btns{display:flex;gap:4px;}
.custom-food-empty{font-size:11px;color:var(--tx3);padding:9px;text-align:center;border:1px dashed var(--bd);border-radius:10px;}
.add-own-food{width:100%;margin-top:8px;min-height:38px;border:1px dashed var(--hi-bd);border-radius:11px;background:var(--hi-bg);color:var(--acc);font-size:12px;font-weight:700;cursor:pointer;}
.form-error{display:none;margin-top:8px;padding:7px 9px;border-radius:8px;background:var(--lo-bg);color:var(--lo);font-size:11px;line-height:1.45;}
.food-search-row{display:grid;grid-template-columns:1fr auto;gap:7px;}
.food-search-row input{height:38px;padding:7px 9px;border:1px solid var(--bd);border-radius:10px;font-size:13px;outline:none;min-width:0;}
.food-search-row input:focus{border-color:var(--acc);}
.food-status{min-height:20px;margin:7px 0;font-size:11px;color:var(--tx3);line-height:1.45;}
.food-results{display:flex;flex-direction:column;gap:6px;max-height:265px;overflow-y:auto;}
.food-result{width:100%;display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--sur2);cursor:pointer;}
.food-result:hover{border-color:var(--acc);background:var(--hi-bg);}
.food-result-name{font-size:12px;font-weight:700;color:var(--tx);}
.food-result-brand,.food-result-macro{font-size:10px;color:var(--tx3);margin-top:2px;}
.food-result-kcal{font-size:12px;color:var(--acc);font-weight:700;white-space:nowrap;}
.upload-box{display:block;border:1px dashed var(--hi-bd);background:var(--hi-bg);color:var(--acc);border-radius:12px;padding:14px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;}
.upload-box input{display:none;}
.ocr-preview{display:none;max-width:100%;max-height:190px;margin:8px auto;border-radius:10px;border:1px solid var(--bd);object-fit:contain;}
.source-note{margin-bottom:9px;padding:7px 9px;background:#f7faf8;border:1px solid #dcebe4;border-radius:9px;color:var(--tx2);font-size:10px;line-height:1.4;}

@media (max-width:430px){
  .app{padding-left:10px;padding-right:10px;}
  .hd{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px;}
  .sg{grid-template-columns:repeat(2,1fr);}
  .stats{grid-template-columns:repeat(4,1fr);}
  .profiles{grid-template-columns:1fr;}
  .week{gap:5px;}
  .dc{min-height:72px;padding-top:7px;}
  .srow{grid-template-columns:auto 1fr;gap:7px 8px;}
  .hint{grid-column:1/-1;}
  .food-row{grid-template-columns:8px minmax(78px,1fr) 24px 54px 24px 14px minmax(40px,auto) 28px 28px;gap:4px;padding:7px 6px;}
  .pantry-row{grid-template-columns:1fr;}
  .pantry-btn{width:100%;}
  .raw-tag{display:none!important;}
  .meal-sub{font-size:10px;}
  .dt{width:100%;justify-content:space-between;}
  .coach-body{grid-template-columns:78px 1fr;gap:10px;}
  .fuel-ring{width:74px;height:74px;}

}

function diffClass(actual,target){

function unitScale(d){return d&&d.unitG?d.unitG:1;}

function roundFoodAmount(d,n){

function amountForFood(food,baseG){

function autoMeals(type){
  const baseType=type==='train'?'high':type==='rest'?'low':type;
  const t=tgt[type]||tgt[baseType];
  const tc=t.carb,tp=t.prot;
  const gramsC=(macro,food,ratio)=>amountForFood(food,macro*ratio/(DB[food].c/100));
  const gramsP=(macro,food,ratio)=>amountForFood(food,macro*ratio/(DB[food].p/100));
  const macros=plan=>{
    let r={c:0,f:0,p:0,k:0};
    plan.flat().forEach(it=>{const m=itemMacro(it);for(let x in r)r[x]+=m[x];});
    return r;
  };
  const finish=plan=>{
    const m=macros(plan);
    const oil=Math.max(0,Math.round(t.fat-m.f));
    if(oil>=2)plan[3].push({n:'食用油',g:oil,lk:0});
    return plan;
  };

    const riceG=gramsC(tc,'米饭',.72);
    const sweetG=gramsC(tc,'番薯',.18);
    const chickenG=gramsP(tp,'鸡腿(去皮)',.35);
    const eggG=gramsP(tp,'鸡蛋',.08);

    ]);

    const riceG=gramsC(tc,'米饭',.45);
    const sweetG=gramsC(tc,'番薯',.25);
    const chickenG=gramsP(tp,'鸡腿(去皮)',.25);
    const eggG=gramsP(tp,'鸡蛋',.08);
    const shrimpG=gramsP(tp,'虾',.17);
    const salmonG=gramsP(tp,'三文鱼',.15);
    return finish([
      [{n:'番薯',g:sweetG,lk:0},{n:'鸡蛋',g:eggG,lk:0}],
      [{n:'米饭',g:riceG,lk:0},{n:'鸡腿(去皮)',g:chickenG,lk:0},{n:'西蓝花',g:120,lk:0},{n:'包菜',g:80,lk:0}],
      [{n:'青瓜',g:200,lk:0}],
      [{n:'三文鱼',g:salmonG,lk:0},{n:'虾',g:shrimpG,lk:0},{n:'包菜',g:120,lk:0},{n:'口蘑',g:80,lk:0}],
    ]);
  }
  const sweetG=gramsC(tc,'番薯',.40);
  const salmonG=gramsP(tp,'三文鱼',.33);
  const eggG=gramsP(tp,'鸡蛋',.17);
  const shrimpG=gramsP(tp,'虾',.18);
  return finish([
    [{n:'鸡蛋',g:Math.round(eggG*.65),lk:0},{n:'西蓝花',g:120,lk:0}],
    [{n:'三文鱼',g:salmonG,lk:0},{n:'芦笋',g:150,lk:0},{n:'口蘑',g:100,lk:0}],
    [{n:'番薯',g:sweetG,lk:0},{n:'青瓜',g:200,lk:0}],
    [{n:'鸡蛋',g:Math.round(eggG*.35),lk:0},{n:'虾',g:shrimpG,lk:0},{n:'包菜',g:150,lk:0}],
  ]);
}

function mOf(items){
  let r={c:0,f:0,p:0,k:0};
  items.forEach(it=>{const m=itemMacro(it);for(let x in r)r[x]+=m[x];});
  return{c:Math.round(r.c),f:Math.round(r.f),p:Math.round(r.p),k:Math.round(r.k)};
}
function dayM(di){let r={c:0,f:0,p:0,k:0};meals[di].forEach(m=>{const mr=mOf(m);for(let x in r)r[x]+=mr[x];});return r;}

function userEnergyProfile(){
  const gender=document.getElementById('i-gender').value;
  const goal=document.getElementById('i-goal').value;
  const age=+document.getElementById('i-age').value;
  const h=+document.getElementById('i-h').value;
  const w=+document.getElementById('i-w').value;
  const bmr=10*w+6.25*h-5*age+(gender==='male'?5:-161);
  const activity=+document.getElementById('i-activity').value||1.375;
  const goalFactor={cut:.85,maintain:1,gain:1.075}[goal]||.85;
  return{w,goal,bmr,tdee:bmr*activity,dailyKcal:bmr*activity*goalFactor,activity};
}

function macroDefaults(ep){
  const proteinFactor={cut:1.8,maintain:1.6,gain:1.8}[ep.goal]||1.8;
  const prot=ep.w*proteinFactor;
  const fat=Math.max(ep.w*.8,ep.dailyKcal*.20/9);
  const avgCarb=Math.max(0,(ep.dailyKcal-prot*4-fat*9)/4);
  return{prot,fat,avgCarb,proteinFactor};
}

function showEnergyStats(ep,highKcal,lowKcal){
  document.getElementById('statsRow').style.display='';
  document.getElementById('s-bmr').textContent=Math.round(ep.bmr);
  document.getElementById('s-tdee').textContent=Math.round(ep.tdee);
  document.getElementById('s-hk').textContent=Math.round(highKcal);
  document.getElementById('s-lk').textContent=Math.round(lowKcal);
  document.querySelector('#s-bmr+.l').textContent='基础代谢 kcal';
  document.querySelector('#s-tdee+.l').textContent='维持热量 kcal';
  document.querySelector('#s-hk+.l').textContent='高碳 kcal';
  document.querySelector('#s-lk+.l').textContent='低碳 kcal';
}

function updateExcelTargets(){
  const ep=userEnergyProfile();
  const base=macroDefaults(ep);
  const counts={
    high:Math.max(1,wT.filter(x=>x==='high').length),
    mid: Math.max(1,wT.filter(x=>x==='mid').length),
    low: Math.max(1,wT.filter(x=>x==='low').length),
  };
  const factors={high:1.3,mid:1,low:.7};
  const factorWeight=counts.high*factors.high+counts.mid*factors.mid+counts.low*factors.low;
  function mk(type){
    const carb=base.avgCarb*7*factors[type]/factorWeight;
    const kcal=base.prot*4+base.fat*9+carb*4;
    return{kcal:Math.round(kcal),carb:Math.round(carb),fat:Math.round(base.fat),prot:Math.round(base.prot)};
  }
  tgt={high:mk('high'),mid:mk('mid'),low:mk('low')};
  showEnergyStats(ep,tgt.high.kcal,tgt.low.kcal);
  document.getElementById('scienceNote').textContent=`当前目标：蛋白质 ${base.proteinFactor.toFixed(1)}g/kg，脂肪至少 0.8g/kg且不低于热量20%，碳水由剩余热量计算；高/中/低日按 1.3 / 1.0 / 0.7 归一分配。`;
}

function updateDingTargets(){
  const ep=userEnergyProfile();
  const base=macroDefaults(ep);
  const counts={train:Math.max(1,wT.filter(x=>x==='train').length),rest:Math.max(1,wT.filter(x=>x==='rest').length)};
  const factors={train:1.15,rest:.85};
  const factorWeight=counts.train*factors.train+counts.rest*factors.rest;
  function mk(type){
    const carb=base.avgCarb*7*factors[type]/factorWeight;
    const kcal=base.prot*4+base.fat*9+carb*4;
    return{kcal:Math.round(kcal),carb:Math.round(carb),fat:Math.round(base.fat),prot:Math.round(base.prot)};
  }
  const train=mk('train'),rest=mk('rest');
  tgt={train,rest,high:train,mid:rest,low:rest};
  showEnergyStats(ep,train.kcal,rest.kcal);
  document.getElementById('scienceNote').textContent=`当前目标：蛋白质 ${base.proteinFactor.toFixed(1)}g/kg，脂肪至少 0.8g/kg且不低于热量20%；运动日提高碳水，休息日降低碳水，一周总量保持不变。`;
}

function updateTargets(){
  if(currentFormulaMode()==='ding')updateDingTargets();
  else updateExcelTargets();
}

function applyTrainingPlan(resetMeals=true){
  const start=+document.getElementById('startDay').value;
  const startMode=document.getElementById('startMode').value;
  const planKey=document.getElementById('trainingPlan').value||'3';
  const plan=TRAINING_PLANS[planKey]||TRAINING_PLANS['3'];
  const pattern=startMode==='train'?plan.trainFirst:plan.restFirst;
  selDay=start;
  const trainRel=pattern.train;
  const highRel=pattern.high||trainRel;
  const isDing=currentFormulaMode()==='ding';
  document.getElementById('planSecTitle').textContent=isDing?'一周运动/非运动安排':'一周碳水安排';
  document.getElementById('planHint').textContent=plan.hint;
  const midRel=pattern.mid;
  wT=DAYS.map((_,i)=>{
    const rel=(i-start+7)%7;
    if(isDing)return trainRel.includes(rel)?'train':'rest';
    if(highRel.includes(rel))return'high';
    return midRel.includes(rel)?'mid':'low';
  });
  dMode=DAYS.map((_,i)=>{
    const rel=(i-start+7)%7;
    return trainRel.includes(rel)?'训练':'休息';
  });
  updateTargets();
  if(resetMeals)meals=buildMeals();
  renderWeek();
  renderDetail();
}

  const start=+document.getElementById('startDay').value;

    const d=document.createElement('div');
    d.className=`dc ${tm.c}${i===selDay?' sel':''}`;
    d.innerHTML=(i===today?'<div class="dc-s">今天</div>':i===start?'<div class="dc-s">开始</div>':'')+
      `<div class="dc-day">${DAYS[i]}</div><div class="dc-lbl ${tm.cls}">${tm.lbl}</div><div class="dc-mode">${dMode[i]}</div><div class="dc-k">${tgt[type].kcal}k</div>`;
    d.onclick=()=>selectDay(i);

    el.appendChild(d);
  });
}

function normFoodText(s){return String(s||'').trim().replace(/[，。、；;,.]/g,'').toLowerCase();}
function resolveFoodName(token){
  const raw=String(token||'').trim();
  if(!raw)return'';
  if(DB[raw])return raw;
  const key=normFoodText(raw);
  if(FOOD_ALIASES[key]&&DB[FOOD_ALIASES[key]])return FOOD_ALIASES[key];
  return FN.find(n=>normFoodText(n)===key)||
    FN.find(n=>normFoodText(n).includes(key)||key.includes(normFoodText(n)))||'';
}

function parseFoodList(text){
  const parts=String(text||'').split(/[\s,，、;；。.+＋/]+/).map(resolveFoodName).filter(Boolean);
  return[...new Set(parts)];
}

function isLowFatProtein(name){
  return name==='鸡腿(去皮)'||name==='虾'||name==='蛋白'||name==='豆腐'||name==='牛肉';
}
function isHighFatFood(name){
  return name==='坚果'||name==='食用油'||name==='安佳黄油'||name==='安佳芝士'||name==='妙可蓝多奶酪'||name==='干奶酪'||name==='鸡翅'||name==='三文鱼'||name==="Member's Mark智利大西洋鲑鱼块"||name==='鲜牛乳'||name==='巴氏杀菌牛乳'||name==="Member's Mark高纤燕麦片";
}
function foodPickRank(name,type){
  const data=DB[name];
  const plain={cls:'',label:''};
  if(type==='high'){
    if(data?.custom&&data.cat==='carb')return{cls:'good',label:'补碳'};
    if(data?.custom&&data.cat==='prot'&&data.f<=6)return{cls:'good',label:'低脂蛋白'};
    if(name==='米饭'||name==='土豆'||name==='番薯'||name==='玉米')return{cls:'good',label:'高碳'};
    if(isLowFatProtein(name))return{cls:'good',label:'低脂蛋白'};
    if(DB[name]?.cat==='veg')return{cls:'good',label:'蔬菜'};
    if(name==="Member's Mark高纤燕麦片"||name==='鲜牛乳'||name==='巴氏杀菌牛乳'||isYogurt(name)||name==='鸡蛋')return{cls:'caution',label:'少脂'};
    if(name==='坚果'||name==='食用油'||name==='安佳黄油'||name==='安佳芝士'||name==='妙可蓝多奶酪'||name==='干奶酪'||name==='鸡翅'||name==='三文鱼')return{cls:'avoid',label:'高脂'};
    if(isBreakfastCarb(name))return{cls:'caution',label:'少量'};
  }
  if(type==='mid'||type==='train'){
    if(data?.custom&&data.cat==='prot')return{cls:'good',label:'蛋白'};
    if(data?.custom&&data.cat==='carb')return{cls:'good',label:'主食'};
    if(isLowFatProtein(name))return{cls:'good',label:'蛋白'};
    if(DB[name]?.cat==='veg')return{cls:'good',label:'蔬菜'};
    if(isStapleCarb(name)||isBreakfastCarb(name))return{cls:'good',label:'主食'};
    if(name==='鸡蛋'||isMilk(name))return{cls:'caution',label:'脂肪'};
    if(isHighFatFood(name))return{cls:'caution',label:'少量'};
  }
  if(type==='low'||type==='rest'){
    if(data?.custom&&data.cat==='prot')return{cls:'good',label:'蛋白'};
    if(data?.custom&&(data.cat==='fat'||data.cat==='oil'))return{cls:'caution',label:'脂肪'};
    if(data?.custom&&data.cat==='carb')return{cls:'avoid',label:'控碳'};
    if(isLowFatProtein(name))return{cls:'good',label:'蛋白'};
    if(DB[name]?.cat==='veg')return{cls:'good',label:'低碳'};
    if(name==='坚果'||name==='食用油'||name==='安佳黄油'||name==='安佳芝士'||name==='妙可蓝多奶酪'||name==='干奶酪'||name==='鸡蛋'||name==='三文鱼'||name==='鸡翅')return{cls:'caution',label:'脂肪'};
    if(isStapleCarb(name)||isBreakfastCarb(name)||isMilk(name))return{cls:'avoid',label:'控碳'};
  }
  return plain;
}

function servingMinFoodAmount(name,mi){
  const d=DB[name];if(!d)return 0;
  const max=maxFoodAmount(name,mi);

  else if(name==='高钙白黄油餐包')min=35;
  else if(name==='葱油拌面'||name==='韩国冷面条')min=50;
  else if(name==='吞拿鱼沙拉三角饭团')min=80;

  else if(isMilk(name))min=150;
  else if(name==='黑松露饼干'||name==='芝士脆饼干')min=15;
  else if(name==='坚果')min=8;
  else if(name==='食用油')min=5;
  else if(name==='安佳黄油')min=5;
  else if(name==='安佳芝士'||name==='妙可蓝多奶酪'||name==='干奶酪')min=15;
  else if(name==='鸡蛋')min=1;
  else if(name==='蛋白')min=50;
  else if(d.cat==='veg')min=100;
  else if(d.cat==='prot')min=60;
  else if(d.cat==='fat')min=50;
  else min=d.unitG?1:Math.max(20,min);
  return Math.min(max,min);
}

function clampFoodRow(it,mi){
  const d=DB[it.n];if(!d)return;
  const val=+it.g||0;
  if(it.manual){
    it.g=roundFoodAmount(d,Math.max(0,val));
    return;
  }
  const min=it.keep&&!it.keepSoft?servingMinFoodAmount(it.n,mi):minFoodAmount(it.n,mi);
  const max=maxFoodAmount(it.n,mi);
  it.g=roundFoodAmount(d,val>0?Math.min(Math.max(val,min),max):0);
}

function starterFoodAmount(name,mi){
  const d=DB[name];if(!d)return 0;
  const max=maxFoodAmount(name,mi);
  if(max<=0)return 0;
  const min=servingMinFoodAmount(name,mi);
  if(min>0)return roundFoodAmount(d,min);
  if(d.unitG)return 1;
  if(name==='食用油')return Math.min(5,max);
  if(d.cat==='veg')return Math.min(120,max);
  return Math.min(50,max);
}

function keepFoodPositive(it,mi){
  if(!it.keep||(+it.g||0)>0)return;
  it.g=starterFoodAmount(it.n,mi);
  clampFoodRow(it,mi);
}

function mealPlanTotals(day){
  let r={c:0,f:0,p:0,k:0};
  day.forEach(items=>items.forEach(it=>{
    const m=itemMacro(it);for(let x in r)r[x]+=m[x];
  }));
  return r;
}

function topMacroSources(day,key,limit=4){
  const byName={};
  day.flat().forEach(it=>{
    const m=itemMacro(it);
    byName[it.n]=(byName[it.n]||0)+m[key];
  });
  return Object.entries(byName)
    .filter(([,v])=>v>0)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,limit)
    .map(([n,v])=>`${n} ${Math.round(v)}${key==='k'?'kcal':'g'}`)
    .join('、');
}

function checkFeasibilityBeforeDistribute(di,day){
  if(currentFormulaMode()==='ding')return true;
  const t=tgt[wT[di]];
  const m=mealPlanTotals(day);
  const checks=[
    {key:'c',label:'碳水',actual:m.c,target:t.carb,unit:'g',tol:5},
    {key:'f',label:'脂肪',actual:m.f,target:t.fat,unit:'g',tol:3},
    {key:'p',label:'蛋白',actual:m.p,target:t.prot,unit:'g',tol:8},
    {key:'k',label:'热量',actual:m.k,target:t.kcal,unit:'kcal',tol:60},
  ];
  const over=checks.filter(x=>x.actual>x.target+x.tol);
  if(!over.length)return true;
  const lines=over.map(x=>`${x.label} ${Math.round(x.actual)}/${Math.round(x.target)}${x.unit}，超 ${Math.round(x.actual-x.target)}${x.unit}`);
  const sources=over.map(x=>`${x.label}主要来自：${topMacroSources(day,x.key)}`).join('\n');
  const msg=[
    '这组食物按最低可食份量已经无法配平当前目标。',
    '',
    lines.join('\n'),
    '',
    sources,
    '',
    '请选择：',
    '1 = 回去调整/删除/替换食物',
    '2 = 接受超标，继续分配',
    '3 = 允许小份量，继续分配'
  ].join('\n');
  const ans=prompt(msg,'1');
  if(ans==='2')return true;
  if(ans==='3'){
    day.forEach(items=>items.forEach(it=>{if(it.keep)it.keepSoft=1;}));
    return true;
  }
  return false;
}

function isBreakfastCarb(name){
  return name==='香蕉'||name==="Member's Mark有机板栗仁"||name.includes('燕麦')||name==='小麦片'||name.includes('面包')||name.includes('吐司')||name==='高钙白黄油餐包'||name==='吞拿鱼沙拉三角饭团';
}
function isStapleCarb(name){
  return name==='米饭'||name==='番薯'||name==='土豆'||name==='玉米'||name==="Member's Mark有机板栗仁"||name==='葱油拌面'||name==='韩国冷面条'||name==='吞拿鱼沙拉三角饭团'||name==='酱爆牛肉手卷'||name==='Swift芝士牛肉卷';
}
function isYogurt(name){return name==='冠益乳风味发酵乳'||name==='卡士007无蔗糖低GI酸奶';}
function isMilk(name){return name==='鲜牛乳'||name==='巴氏杀菌牛乳'||name==='沃集高钙鲜牛奶'||name==="Member's Mark低脂鲜牛奶"||isYogurt(name);}
function isEgg(name){return name==='鸡蛋'||name==='蛋白';}
function isMainProtein(name){
  const d=DB[name];
  return d&&(d.cat==='prot'||d.cat==='fat')&&!isEgg(name)&&!isMilk(name)&&name!=='坚果'&&name!=='安佳黄油'&&name!=='安佳芝士'&&name!=='妙可蓝多奶酪'&&name!=='干奶酪';
}
function preferredMealForExtra(name){
  const d=DB[name];
  if(isBreakfastCarb(name)||isEgg(name)||isMilk(name))return 0;
  if(name==='坚果')return 2;
  if(name==='食用油')return 1;
  if(isStapleCarb(name)||isMainProtein(name)||d.cat==='veg')return 1;
  if(d.cat==='fat')return 3;
  return 1;
}

function buildDayFromPantry(di){
  const names=[...(pantryFoods[di]||[])].filter(n=>DB[n]);
  if(!names.length){alert('请先点「选择食物」，从食物库里选择今天有的食物');return;}
  const day=[[],[],[],[]];
  const add=(mi,name,g=0,keep=1)=>{
    if(!name||!DB[name])return;
    if(day[mi].some(it=>it.n===name))return;
    day[mi].push({n:name,g:g||starterFoodAmount(name,mi),lk:0,keep});
  };
  const first=(list)=>list.find(n=>names.includes(n));
  const byCat=(cat)=>names.filter(n=>DB[n]&&DB[n].cat===cat);
  const breakfastCarbs=names.filter(isBreakfastCarb);
  const staples=names.filter(isStapleCarb);
  const eggs=names.filter(isEgg);
  const milk=names.filter(isMilk);
  const mainProteins=names.filter(isMainProtein);
  const vegs=byCat('veg');
  const fats=names.filter(n=>DB[n]&&DB[n].cat==='fat'&&!isMilk(n)&&!isMainProtein(n));
  const used=new Set();
  const addUse=(mi,name,g=0,keep=1)=>{add(mi,name,g,keep); if(name)used.add(name);};

  const breakfastCarb=first(["Member's Mark高纤燕麦片",'小麦片','全麦面包','生吐司面包','嘉顿亚麻籽全麦吐司',"Member's Mark有机板栗仁",'高钙白黄油餐包','吞拿鱼沙拉三角饭团','香蕉'])||breakfastCarbs[0];
  addUse(0,breakfastCarb,0,1);
  addUse(0,eggs[0],eggs[0]==='鸡蛋'?1:0,1);
  addUse(0,milk[0],milk[0]?200:0,1);

  const lunchStaple=first(['米饭','番薯','土豆','玉米','吞拿鱼沙拉三角饭团','酱爆牛肉手卷','Swift芝士牛肉卷','葱油拌面','韩国冷面条'])||staples[0];
  const dinnerStaple=staples.find(n=>n!==lunchStaple)||lunchStaple;
  addUse(1,lunchStaple,0,1);
  addUse(3,dinnerStaple,0,dinnerStaple!==lunchStaple?1:0);

  const lunchProtein=mainProteins[0];
  const dinnerProtein=mainProteins.find(n=>n!==lunchProtein)||lunchProtein;
  addUse(1,lunchProtein,0,1);
  addUse(3,dinnerProtein,0,dinnerProtein!==lunchProtein?1:0);

  if(vegs[0])addUse(1,vegs[0],0,1);
  if(vegs[1])addUse(3,vegs[1],0,1);
  if(vegs[2])addUse(3,vegs[2],0,1);

  if(names.includes('食用油')){addUse(1,'食用油',5,1);addUse(3,'食用油',5,0);}
  if(names.includes('坚果'))addUse(2,'坚果',0,1);
  if(milk[1])addUse(2,milk[1],200,1);
  else if(milk[0]&&!day[0].some(it=>it.n===milk[0]))addUse(2,milk[0],200,1);
  const snackCarb=breakfastCarbs.find(n=>n!==breakfastCarb);
  addUse(2,snackCarb,0,1);
  if(fats[0]&&!used.has(fats[0]))addUse(2,fats[0],0,1);

  names.forEach(name=>{
    if(used.has(name))return;
    addUse(preferredMealForExtra(name),name,0,1);
  });

  if(!day.flat().some(it=>DB[it.n]&&DB[it.n].cat!=='veg')){
    alert('这些食物里缺少主食/蛋白/脂肪类，没法配平一天餐单');
    return;
  }
  if(!checkFeasibilityBeforeDistribute(di,day))return;
  meals[di]=day;
  autoDistributeDay(di);
}

function itemMacro(it){
  const d=DB[it.n];if(!d)return{c:0,f:0,p:0,k:0};
  const g=amountBase(it);
  const c=d.c*g/100,f=d.f*g/100,p=d.p*g/100;
  const k=currentFormulaMode()==='ding'?d.k*g/100:c*4+f*9+p*4;
  return{c,f,p,k};
}

function rawDayM(di){
  let r={c:0,f:0,p:0,k:0};
  meals[di].forEach((items,mi)=>items.forEach(it=>{
    const m=itemMacro(it);for(let x in r)r[x]+=m[x];
  }));
  return r;
}

function currentGoalMode(){
  if(currentFormulaMode()==='ding')return'cut';
  const el=document.getElementById('i-goal');
  return el?el.value:'cut';
}

function dayTypeOf(di){
  return wT[di]||'mid';
}
function isLowDayType(type){
  return type==='low'||type==='rest';
}
function isHighDayType(type){
  return type==='high'||type==='train';
}
function foodRoleScore(di,target){
  const type=dayTypeOf(di);
  const low=isLowDayType(type);
  const high=isHighDayType(type);
  const total=rawDayM(di);
  const over=v=>Math.max(0,v);
  const sq=(v,scale,w=1)=>Math.pow(v/scale,2)*w;
  let sc=0;
  const vegCount={};
  let vegKinds=0;
  meals[di].forEach((items,mi)=>items.forEach(it=>{
    const d=DB[it.n];if(!d)return;
    if(d.cat==='veg'){
      vegCount[it.n]=(vegCount[it.n]||0)+(+it.g||0);
      vegKinds++;
      return;
    }
    const m=itemMacro(it);
    if(low&&d.cat==='prot'&&total.p>target.prot+4){
      sc+=sq(m.p,14,1.4)+sq(over((+it.g||0)-proteinMaxByFood(it.n,mi)*.75),30,1.0);
    }
    if(low&&(d.cat==='fat'||d.cat==='oil')&&total.f<target.fat-3){
      sc-=Math.min(1.8,m.f/18);
    }
    if(high&&(d.cat==='fat'||d.cat==='oil')&&total.f>target.fat+4){
      sc+=sq(m.f,10,1.3);
    }
  }));
  Object.values(vegCount).forEach(g=>{
    if(g>260)sc+=sq(g-260,80,1.0);
  });
  if(vegKinds>1){
    Object.values(vegCount).forEach(g=>{if(g>180)sc+=sq(g-180,70,.6);});
  }
  return sc;
}

function distributeScore(di,target){
  const m=rawDayM(di);
  if(currentFormulaMode()==='ding')return Math.pow((m.k-target.kcal)/15,2);
  const mode=currentGoalMode();
  const dayType=dayTypeOf(di);
  const lowDay=isLowDayType(dayType);
  const kcal=m.k-target.kcal;
  const carb=m.c-target.carb;
  const fat=m.f-target.fat;
  const prot=m.p-target.prot;
  const over=v=>Math.max(0,v);
  const under=v=>Math.max(0,-v);
  const sq=(v,scale,w=1)=>Math.pow(v/scale,2)*w;

  if(mode==='gain'){
    return sq(under(prot),3,4.0)+sq(over(prot-12),10,.4)+
      sq(under(carb),5,3.0)+sq(over(carb),8,1.0)+
      sq(under(fat),5,2.0)+sq(over(fat),7,1.0)+
      sq(under(kcal),45,.25)+sq(over(kcal),60,.15);
  }
  if(mode==='maintain'){
    return sq(prot,4,3.0)+
      sq(carb,5,3.0)+
      sq(fat,5,2.4)+
      sq(kcal,60,.2);
  }
  if(lowDay){
    return sq(under(prot),3,4.0)+sq(over(prot-4),5,6.0)+
      sq(carb,5,3.4)+
      sq(fat,5,2.6)+
      sq(Math.min(under(fat),over(prot)),3,4.0)+
      sq(over(kcal),70,.25)+sq(under(kcal),80,.08)+
      foodRoleScore(di,target);
  }
  return sq(under(prot),3,4.0)+sq(over(prot-10),10,.4)+
    sq(carb,5,3.4)+
    sq(fat,5,2.8)+
    sq(over(kcal),70,.2)+sq(under(kcal),70,.1)+
    foodRoleScore(di,target);
}

function pruneZeroFoods(di){
  meals[di]=meals[di].map(items=>items.filter(it=>{
    if(it.keep)return true;
    if(it.lk)return true;
    const d=DB[it.n];
    return !d||d.cat==='veg'||(+it.g||0)>0;
  }));
}

function distributionGapScore(di,target){
  const m=rawDayM(di);
  const sq=(v,scale,w=1)=>Math.pow(v/scale,2)*w;
  return sq(m.c-target.carb,5,3.4)+
    sq(m.f-target.fat,3,3.0)+
    sq(m.p-target.prot,5,2.0)+
    sq(m.k-target.kcal,35,.8);
}

function distributionIsBalanced(di,target){
  const m=rawDayM(di);
  return Math.abs(m.c-target.carb)<=5&&
    Math.abs(m.f-target.fat)<=3&&
    Math.abs(m.p-target.prot)<=8&&
    Math.abs(m.k-target.kcal)<=60;
}

function autoMaxFoodAmount(u,target){
  const normal=maxFoodAmount(u.it.n,u.mi);
  const d=u.d;
  let practical=normal;
  if(u.it.n==='米饭')practical=600;
  else if(isStapleCarb(u.it.n))practical=500;
  else if(isOatFood(u.it.n))practical=120;
  else if(u.it.n.includes('面包')||u.it.n.includes('吐司'))practical=200;
  else if(u.it.n==='坚果')practical=80;
  else if(u.it.n==='食用油')practical=35;
  else if(isYogurt(u.it.n))practical=300;
  else if(isMilk(u.it.n))practical=600;
  else if(d.cat==='prot')practical=350;
  else if(d.cat==='fat')practical=300;
  else if(d.custom&&d.cat==='carb')practical=500;
  return Math.max(normal,practical);
}

function distributionBounds(u,target){
  const hardKeep=u.it.keep&&!u.it.keepSoft;
  const positiveMin=hardKeep?servingMinFoodAmount(u.it.n,u.mi):minFoodAmount(u.it.n,u.mi);
  return{hardKeep,positiveMin,max:autoMaxFoodAmount(u,target)};
}

function clampDistributionRow(u,target){
  const b=distributionBounds(u,target);
  let val=Math.max(0,+u.it.g||0);
  if(val>0)val=Math.min(Math.max(val,b.positiveMin),b.max);
  else if(b.hardKeep)val=b.positiveMin;
  u.it.g=roundFoodAmount(u.d,val);
}

function distributionCandidates(u,target){
  const b=distributionBounds(u,target);
  const step=u.d.unitG?1:5;
  const values=[];
  if(!b.hardKeep)values.push(0);
  const first=Math.ceil(b.positiveMin/step)*step;
  for(let value=first;value<=b.max;value+=step)values.push(value);
  values.push(roundFoodAmount(u.d,Math.min(b.max,Math.max(b.positiveMin,+u.it.g||0))));
  return[...new Set(values.filter(value=>Number.isFinite(value)&&value>=0&&value<=b.max))];
}

function tuneDistribution(di,items,target){
  const pool=items.filter(u=>u.d.cat!=='veg'&&u.d.k>0);
  if(!pool.length)return;
  const candidates=pool.map(u=>distributionCandidates(u,target));
  const score=()=>distributionGapScore(di,target)+distributeScore(di,target)*.2;
  const read=()=>pool.map(u=>+u.it.g||0);
  const write=values=>pool.forEach((u,i)=>{u.it.g=values[i];});
  const optimize=()=>{
    for(let pass=0;pass<12;pass++){
      let changed=false;
      const order=pass%2?pool.map((_,i)=>pool.length-1-i):pool.map((_,i)=>i);
      order.forEach(i=>{
        const u=pool[i],old=u.it.g;
        let bestValue=old,bestScore=score();
        candidates[i].forEach(value=>{
          u.it.g=value;
          const nextScore=score();
          if(nextScore+0.0001<bestScore){bestScore=nextScore;bestValue=value;}
        });
        u.it.g=bestValue;
        if(bestValue!==old)changed=true;
      });
      if(!changed||distributionIsBalanced(di,target))break;
    }
  };

  const starting=read();
  let bestValues=starting.slice(),bestScore=score();
  let randomSeed=2166136261;
  pool.forEach(u=>{for(const ch of `${u.it.n}:${u.mi}`)randomSeed=Math.imul(randomSeed^ch.charCodeAt(0),16777619);});
  const random=()=>{
    randomSeed^=randomSeed<<13;randomSeed^=randomSeed>>>17;randomSeed^=randomSeed<<5;
    return(randomSeed>>>0)/4294967296;
  };
  const starts=14;
  for(let run=0;run<starts;run++){
    if(run===0)write(starting);
    else if(run===1)write(candidates.map(values=>values[0]));
    else if(run===2)write(candidates.map(values=>values[Math.floor((values.length-1)*.5)]));
    else write(candidates.map(values=>values[Math.floor(random()*values.length)]));
    optimize();
    const nextScore=score();
    if(nextScore+0.0001<bestScore){bestScore=nextScore;bestValues=read();}
    if(distributionIsBalanced(di,target)){bestValues=read();break;}
  }
  write(bestValues);
}

function macroAdjustPool(di,items,key){
  const type=dayTypeOf(di);
  const low=isLowDayType(type);
  const high=isHighDayType(type);
  const pool=items.filter(u=>u.d.cat!=='veg'&&u.d[key]>0);
  if(!pool.length)return [];
  if(key==='f'){
    const primary=pool.filter(u=>u.d.cat==='fat'||u.d.cat==='oil');
    if(low&&primary.length)return primary;
    if(primary.length)return primary.concat(pool.filter(u=>u.d.cat!=='prot'&&!primary.includes(u)));
  }
  if(key==='p'){
    const primary=pool.filter(u=>u.d.cat==='prot'||isEgg(u.it.n));
    if(primary.length)return primary;
  }
  if(key==='c'){
    const primary=pool.filter(u=>u.d.cat==='carb');
    if(primary.length)return primary;
  }
  if(high&&key==='c')return pool.filter(u=>u.d.cat!=='fat'&&u.d.cat!=='oil').concat(pool.filter(u=>u.d.cat==='fat'||u.d.cat==='oil'));
  return pool;
}

function autoDistributeCaloriesOnly(di,unlocked,dayTarget,mealRatio){
  unlocked.forEach(u=>{
    delete u.it.manual;
    if(u.d.cat==='veg'){
      const base=u.mi===1||u.mi===3?150:u.mi===2?100:80;
      u.it.g=round5((+u.it.g||0)>0?u.it.g:base);
    }else if(u.it.keep){
      keepFoodPositive(u.it,u.mi);
    }else{
      u.it.g=0;
    }
    clampFoodRow(u.it,u.mi);
    u.it.lk=0;
  });

  meals[di].forEach((items,mi)=>{
    const pool=items.filter(it=>!it.lk&&DB[it.n]&&DB[it.n].cat!=='veg'&&DB[it.n].k>0);
    if(!pool.length)return;
    const fixedK=items.reduce((s,it)=>pool.includes(it)?s:s+itemMacro(it).k,0);
    const kcalGoal=Math.max(0,dayTarget.kcal*mealRatio[mi]-fixedK);
    const weightSum=pool.reduce((s,it)=>{const d=DB[it.n];return s+(+it.g>0?+it.g:(d&&d.unitG?1:100));},0)||pool.length;
    pool.forEach(it=>{
      const d=DB[it.n];
      const seed=d&&d.unitG?1:100;
      const share=(+it.g>0?+it.g:seed)/weightSum;
      it.g=roundFoodAmount(d,kcalGoal*share/macroPerAmount(d,'k'));
      clampFoodRow(it,mi);
      keepFoodPositive(it,mi);
    });
  });

  for(let pass=0;pass<6;pass++){
    const gap=dayTarget.kcal-rawDayM(di).k;
    if(Math.abs(gap)<=8)break;
    const pool=unlocked.filter(u=>u.d.cat!=='veg'&&u.d.k>0);
    if(!pool.length)break;
    const power=pool.reduce((s,u)=>s+macroPerAmount(u.d,'k')*(gap>0?1:Math.max(1,u.it.g)),0)||1;
    pool.forEach(u=>{
      const per=macroPerAmount(u.d,'k');
      const share=(gap>0?per:per*Math.max(1,u.it.g))/power;
      const deltaAmt=gap*share/per;
      u.it.g=roundFoodAmount(u.d,Math.max(0,u.it.g+deltaAmt));
      clampFoodRow(u.it,u.mi);
      keepFoodPositive(u.it,u.mi);
    });
  }

  tuneDistribution(di,unlocked,dayTarget);
  unlocked.forEach(u=>keepFoodPositive(u.it,u.mi));
}

function autoDistributeDay(di){
  const plan=meals[di];
  const unlocked=[];
  plan.forEach((items,mi)=>items.forEach((it,fi)=>{
    const d=DB[it.n];if(!d||it.lk)return;
    unlocked.push({it,d,mi,fi});
  }));
  if(!unlocked.length){alert('没有可分配的食物：请先添加食物，或解锁食物克重');return;}

  const usedMeals=plan.map((items,mi)=>items.some(it=>DB[it.n]&&!it.lk&&DB[it.n].cat!=='veg')?mi:null).filter(mi=>mi!==null);
  if(!usedMeals.length){alert('请至少添加一种主食/蛋白/脂肪类食物，再一键分配');return;}

  const baseRatios=[.25,.40,.10,.25];
  const ratioTotal=usedMeals.reduce((s,mi)=>s+baseRatios[mi],0)||1;
  const mealRatio=baseRatios.map((r,mi)=>usedMeals.includes(mi)?r/ratioTotal:0);
  const dayTarget=tgt[wT[di]];
  const original=unlocked.map(u=>({g:u.it.g,manual:u.it.manual}));
  const beforeScore=distributionGapScore(di,dayTarget);

  if(currentFormulaMode()!=='ding'&&distributionIsBalanced(di,dayTarget)){
    renderDetail();
    return;
  }

  if(currentFormulaMode()==='ding'){
    autoDistributeCaloriesOnly(di,unlocked,dayTarget,mealRatio);
    pruneZeroFoods(di);
    renderDetail();
    return;
  }

  unlocked.forEach(u=>{
    delete u.it.manual;
    if(u.d.cat==='veg'){
      const base=u.mi===1||u.mi===3?150:u.mi===2?100:80;
      u.it.g=round5((+u.it.g||0)>0?u.it.g:base);
    }else if(u.it.keep){
      keepFoodPositive(u.it,u.mi);
    }else{
      u.it.g=0;
    }
    clampDistributionRow(u,dayTarget);
    u.it.lk=0;
  });

  const groups=[
    {cats:['carb'],key:'c',target:'carb'},
    {cats:['prot'],key:'p',target:'prot'},
    {cats:['fat','oil'],key:'f',target:'fat'},
  ];

  plan.forEach((items,mi)=>{
    const mealTargets={
      c:dayTarget.carb*mealRatio[mi],
      p:dayTarget.prot*mealRatio[mi],
      f:dayTarget.fat*mealRatio[mi],
    };
    groups.forEach(gp=>{
      const pool=items.filter(it=>!it.lk&&DB[it.n]&&gp.cats.includes(DB[it.n].cat)&&DB[it.n][gp.key]>0);
      if(!pool.length)return;
      const fixed=items.reduce((s,it)=>{
        if(pool.includes(it))return s;
        return s+itemMacro(it)[gp.key];
      },0);
      const goal=Math.max(0,mealTargets[gp.key]-fixed);
      const weightSum=pool.reduce((s,it)=>{const d=DB[it.n];return s+(+it.g>0?+it.g:(d&&d.unitG?1:100));},0)||pool.length;
      pool.forEach(it=>{
        const d=DB[it.n];
        const seed=d&&d.unitG?1:100;
        const share=(+it.g>0?+it.g:seed)/weightSum;
        it.g=roundFoodAmount(d,goal*share/macroPerAmount(d,gp.key));
        const u=unlocked.find(row=>row.it===it);
        if(u)clampDistributionRow(u,dayTarget);
      });
    });
  });

  for(let pass=0;pass<5;pass++){
    const dm=rawDayM(di);
    [
      {key:'c',target:dayTarget.carb,cats:['carb']},
      {key:'p',target:dayTarget.prot,cats:['prot']},
      {key:'f',target:dayTarget.fat,cats:['fat','oil']},
    ].forEach(rule=>{
      const gap=rule.target-dm[rule.key];
      if(Math.abs(gap)<=4)return;
      const pool=macroAdjustPool(di,unlocked,rule.key);
      if(!pool.length)return;
      const power=pool.reduce((s,u)=>s+macroPerAmount(u.d,rule.key)*(gap>0?1:Math.max(1,u.it.g)),0)||1;
      pool.forEach(u=>{
        const per=macroPerAmount(u.d,rule.key);
        const share=(gap>0?per:per*Math.max(1,u.it.g))/power;
        const deltaAmt=gap*share/per;
        u.it.g=roundFoodAmount(u.d,Math.max(0,u.it.g+deltaAmt));
        clampDistributionRow(u,dayTarget);
      });
    });
  }

  tuneDistribution(di,unlocked,dayTarget);
  unlocked.forEach(u=>clampDistributionRow(u,dayTarget));
  if(distributionGapScore(di,dayTarget)>beforeScore+0.0001){
    unlocked.forEach((u,i)=>{
      u.it.g=original[i].g;
      if(original[i].manual===undefined)delete u.it.manual;
      else u.it.manual=original[i].manual;
    });
  }
  pruneZeroFoods(di);

  renderDetail();
}

function stepGram(di,mi,fi,delta){
  const cur=+meals[di][mi][fi].g||0;
  const d=DB[meals[di][mi][fi].n];
  const step=d&&d.unitG?(delta>0?1:-1):delta;
  onGramChange(di,mi,fi,Math.max(0,cur+step));
}

function suggestAdjust(di,it){
  if(it.lk)return{text:'已锁',dir:'',title:'这项已锁定，不参与调整建议'};
  const d=DB[it.n];if(!d)return{text:'',dir:'',title:''};
  if(d.cat==='veg')return{text:'蔬菜',dir:'',title:'蔬菜主要用于纤维和饱腹感，不优先用于补三大营养缺口'};
  const t=tgt[wT[di]],dm=dayM(di);
  if(currentFormulaMode()==='ding'){
    const gap=t.kcal-dm.k,per=macroPerAmount(d,'k');
    if(Math.abs(gap)<30||per<=0)return{text:'接近',dir:'',title:'当天热量已接近'};
    const rawAmt=roundFoodAmount(d,Math.abs(gap)/per);
    const amt=gap>0?rawAmt:Math.min(it.g,rawAmt);
    return{
      text:`热 ${gap>0?'+':'-'}${amt}${d.u||'g'}`,
      dir:gap>0?'add':'cut',
      title:`叮叮模式按热量估算，可选择${gap>0?'增加':'减少'}约 ${amt}${d.u||'g'} ${it.n}`
    };
  }
  const map={
    carb:{key:'c',target:'carb',label:'碳',val:d.c},
    prot:{key:'p',target:'prot',label:'蛋',val:d.p},
    fat:{key:'f',target:'fat',label:'脂',val:d.f},
    oil:{key:'f',target:'fat',label:'脂',val:d.f},
  };
  let m=map[d.cat]||map.prot;
  let gap=t[m.target]-dm[m.key];
  let per=macroPerAmount(d,m.key);
  if(Math.abs(gap)<3||per<=0){
    gap=t.kcal-dm.k;m={label:'热'};per=macroPerAmount(d,'k');
    if(Math.abs(gap)<30||per<=0)return{text:'接近',dir:'',title:'当天目标已接近'};
    const rawAmt=roundFoodAmount(d,Math.abs(gap)/per);
    const amt=gap>0?rawAmt:Math.min(it.g,rawAmt);
    return{
      text:`${gap>0?'+':'-'}${amt}${d.u||'g'}`,
      dir:gap>0?'add':'cut',
      title:`按热量估算，可选择${gap>0?'增加':'减少'}约 ${amt}${d.u||'g'} ${it.n}`
    };
  }
  const rawAmt=roundFoodAmount(d,Math.abs(gap)/per);
  const amt=gap>0?rawAmt:Math.min(it.g,rawAmt);
  return{
    text:`${m.label} ${gap>0?'+':'-'}${amt}${d.u||'g'}`,
    dir:gap>0?'add':'cut',
    title:`按${m.label}缺口估算，可选择${gap>0?'增加':'减少'}约 ${amt}${d.u||'g'} ${it.n}`
  };
}

function onGramChange(di,mi,fi,newG){
  const changed=meals[di][mi][fi];
  const fd=DB[changed.n];
  const old=+changed.g||0;
  changed.g=Math.max(0,roundFoodAmount(fd,newG));
  changed.manual=1;
  const delta=changed.g-old;
  if(Math.abs(delta)<1){renderDetail();return;}

  const adjustables=[];
  meals[di].forEach((mitems,mj)=>mitems.forEach((it,fj)=>{
    const dd=DB[it.n];if(!dd)return;
    if(mj===mi&&fj===fi)return;
    clampFoodRow(it,mj);
    if(it.lk||dd.cat==='veg'||dd.k<=0)return;
    adjustables.push({it,d:dd,mi:mj,fi:fj});
  }));

  if(adjustables.length){
    tuneDistribution(di,adjustables,tgt[wT[di]]);
    adjustables.forEach(u=>keepFoodPositive(u.it,u.mi));
  }
  renderDetail();
}

function inferFoodCategory(c,f,p){

  return'carb';
}

function getFoodAiAccessToken(){
  let token='';
  try{token=localStorage.getItem(FOOD_AI_ACCESS_KEY)||'';}catch(e){}
  if(token)return token;
  token=String(prompt('首次使用请输入碳循环 AI 识别码（只需输入一次）')||'').trim();
  if(!token){const error=new Error('没有输入识别码，已取消 AI 识别。');error.code='ACCESS_CANCELLED';throw error;}
  try{localStorage.setItem(FOOD_AI_ACCESS_KEY,token);}catch(e){}
  return token;
}

async function callFoodAi(payload){
  const token=getFoodAiAccessToken();
  let response;
  try{
    response=await fetch(FOOD_AI_ENDPOINT,{
      method:'POST',
      headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify(payload),
    });
  }catch(e){const error=new Error('暂时无法连接腾讯云 AI 识别，请检查网络后重试。');error.code='NETWORK';throw error;}
  const data=await response.json().catch(()=>({}));
  if(!response.ok){
    if(response.status===401){try{localStorage.removeItem(FOOD_AI_ACCESS_KEY);}catch(e){}}
    const error=new Error(data.error||`AI 识别失败（${response.status}）`);error.code=data.code||`HTTP_${response.status}`;throw error;
  }
  if(!data.food)throw new Error('AI 没有返回可用的食物数据。');
  return data;
}

function foodFromAiResponse(data){
  const x=data.food||{};

  if(!x.name||[c,f,p,k].some(v=>!Number.isFinite(v)||v<0))throw new Error('AI 返回的营养数据不完整，请重试。');
  return{

    c:+c.toFixed(1),f:+f.toFixed(1),p:+p.toFixed(1),k:+k.toFixed(1),

async function fileToAiDataUrl(file){
  if(!/^image\/(?:jpeg|png|webp)$/i.test(file.type||''))throw new Error('请选择 JPG、PNG 或 WebP 图片。');
  if(file.size>15*1024*1024)throw new Error('照片太大，请换一张或先裁剪。');
  const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
  const maxSide=1800,scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();
  let dataUrl=canvas.toDataURL('image/jpeg',.88);
  if(dataUrl.length>5.4*1024*1024){
    const smaller=document.createElement('canvas'),smallScale=Math.min(1,1400/Math.max(canvas.width,canvas.height));
    smaller.width=Math.max(1,Math.round(canvas.width*smallScale));smaller.height=Math.max(1,Math.round(canvas.height*smallScale));
    const smallerCtx=smaller.getContext('2d',{alpha:false});smallerCtx.fillStyle='#fff';smallerCtx.fillRect(0,0,smaller.width,smaller.height);smallerCtx.drawImage(canvas,0,0,smaller.width,smaller.height);
    dataUrl=smaller.toDataURL('image/jpeg',.78);
  }
  return dataUrl;
}

  status.textContent=`已在现有食物库找到 ${names.length} 项，可直接使用。`;
  box.innerHTML=names.map((name,i)=>{const x=DB[name];return`<button class="food-result" type="button" onclick="useKnownFoodAt(${i})"><span><span class="food-result-name">${escapeHtml(name)}</span><span class="food-result-brand">现有食物库 · 每100${escapeHtml(x.u||'g')}</span><span class="food-result-macro">碳${x.c}g · 脂${x.f}g · 蛋${x.p}g</span></span><span class="food-result-kcal">${Math.round(x.k)} kcal</span></button>`;}).join('');
}

function useKnownFoodAt(i){

async function smartFoodTextSubmit(){
  const input=document.getElementById('smartFoodQuery');
  const value=String(input?.value||'').trim();
  const {status,box}=smartFoodElements();
  if(!value){if(status)status.textContent='请输入食物名称或包装条码。';return;}
  const known=findKnownFoods(value);if(known.length){renderKnownFoods(known);return;}
  status.textContent='正在通过腾讯云 AI 自动识别…';if(box)box.innerHTML='';

async function searchOnlineFoods(query='',fallbackMessage=''){
  const q=String(query||document.getElementById('smartFoodQuery')?.value||'').trim();
  const {status,box}=smartFoodElements();
  if(!status||!box)return;
  if(!q){status.textContent='请先输入品牌或食物名称。';return;}
  const known=findKnownFoods(q);if(known.length){renderKnownFoods(known);return;}
  status.textContent=fallbackMessage?'AI 暂时不可用，正在改用公开食物数据库…':'正在联网搜索…';box.innerHTML='';
  try{
    const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&fields=code,product_name,product_name_zh,generic_name,generic_name_zh,brands,nutriments`;
    const response=await fetch(url,{headers:{'Accept':'application/json'}});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const json=await response.json();
    const rows=(json.products||[]).map(normalizeOnlineProduct).filter(Boolean);
    window._onlineFoodResults=rows;
    status.textContent=rows.length?`已判断为食物名称，找到 ${rows.length} 个结果。请选择最接近的一项。`:'没有找到可用营养数据。可以拍包装营养表，或手动填写。';
    box.innerHTML=rows.map((x,i)=>`<button class="food-result" type="button" onclick="useOnlineFoodAt(${i})"><span><span class="food-result-name">${escapeHtml(x.name)}</span><span class="food-result-brand">${escapeHtml(x.brand||'未标品牌')} · 每100g</span><span class="food-result-macro">碳${x.c}g · 脂${x.f}g · 蛋${x.p}g</span></span><span class="food-result-kcal">${Math.round(x.k)} kcal</span></button>`).join('');
  }catch(e){status.textContent='联网搜索失败，请稍后重试，或拍营养表/手动填写。';}
}

function useOnlineFoodAt(i){
  const x=(window._onlineFoodResults||[])[i];if(!x)return;
  renderFoodEditor(x,'');
}

async function lookupBarcode(code=''){
  const input=document.getElementById('smartFoodQuery');
  const value=String(code||input?.value||'').replace(/\D/g,'');
  const {status,box}=smartFoodElements();
  if(!status||!box)return false;
  if(!value){status.textContent='请输入或拍摄商品条码。';return false;}
  if(input)input.value=value;status.textContent='正在查询条码…';box.innerHTML='';
  try{
    const response=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(value)}.json?fields=code,product_name,product_name_zh,generic_name,generic_name_zh,brands,nutriments`,{headers:{'Accept':'application/json'}});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const json=await response.json();const x=normalizeOnlineProduct(json.product);
    if(!x){status.textContent='没有找到这个条码，建议拍营养成分表。';return false;}
    window._onlineFoodResults=[x];status.textContent='已判断为包装条码，并找到商品。请核对后使用。';
    box.innerHTML=`<button class="food-result" type="button" onclick="useOnlineFoodAt(0)"><span><span class="food-result-name">${escapeHtml(x.name)}</span><span class="food-result-brand">${escapeHtml(x.brand||'未标品牌')} · 条码 ${escapeHtml(value)}</span><span class="food-result-macro">碳${x.c}g · 脂${x.f}g · 蛋${x.p}g</span></span><span class="food-result-kcal">${Math.round(x.k)} kcal</span></button>`;return true;
  }catch(e){status.textContent='条码查询失败，请检查网络后重试。';return false;}
}

async function detectBarcodeInPhoto(file){
  if(!('BarcodeDetector'in window))return'';
  try{
    const formats=await BarcodeDetector.getSupportedFormats?.()||[];
    const wanted=['ean_13','ean_8','upc_a','upc_e','code_128'].filter(x=>!formats.length||formats.includes(x));
    const bitmap=await createImageBitmap(file);const detector=new BarcodeDetector(wanted.length?{formats:wanted}:undefined);
    const codes=await detector.detect(bitmap);bitmap.close?.();
    return String(codes[0]?.rawValue||'').replace(/\D/g,'');
  }catch(e){return'';}
}

function normalizeOcrText(text){
  const fw='０１２３４５６７８９．：％';const hw='0123456789.:%';
  return String(text||'').replace(/[０-９．：％]/g,ch=>hw[fw.indexOf(ch)]).replace(/,/g,'.');
}

function parseNutritionLabel(text){
  const clean=normalizeOcrText(text).replace(/[|｜]/g,' ');
  const numberAfter=labels=>{
    const m=clean.match(new RegExp(`(?:${labels})\\s*[:：]?\\s*(\\d+(?:\\.\\d+)?)\\s*(?:g|克)?`,'i'));
    return m?+m[1]:0;
  };
  const c=numberAfter('碳水化合物|碳水|carbohydrates?');
  const f=numberAfter('脂肪|fat');
  const p=numberAfter('蛋白质|protein');
  const energy=clean.match(/(?:能量|热量|energy)\s*[:：]?\s*(\d+(?:\.\d+)?)\s*(kcal|千卡|kj|千焦)?/i);
  let k=energy?+energy[1]:0;const unit=(energy?.[2]||'').toLowerCase();
  if(unit==='kj'||unit==='千焦'||(!unit&&k>900))k=k/4.184;
  if(!k&&(c||f||p))k=c*4+f*9+p*4;
  const u=/100\s*(?:ml|毫升)/i.test(clean)?'ml':'g';
  return{name:'',c:+c.toFixed(1),f:+f.toFixed(1),p:+p.toFixed(1),k:+k.toFixed(1),cat:inferFoodCategory(c,f,p),u,raw:`营养表照片/每100${u}`,source:'营养表照片OCR',sourceId:'',ocrText:clean};
}

function ensureTesseract(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  if(window._tesseractPromise)return window._tesseractPromise;
  window._tesseractPromise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js';script.crossOrigin='anonymous';script.integrity='sha384-2BQ3U3OdKOb0Uczxqr41I9UvZkzr4V9Hv8uSzMMZAlmhsFClvdZX5wi5fDCzG+tM';
    script.onload=()=>resolve(window.Tesseract);script.onerror=()=>reject(new Error('OCR library load failed'));document.head.appendChild(script);
  });
  return window._tesseractPromise;
}

function nutritionTextScore(text){
  const s=normalizeOcrText(text);return['营养成分','能量','热量','碳水','蛋白质','脂肪','nutrition','energy','carbohydrate','protein','fat'].filter(x=>s.toLowerCase().includes(x.toLowerCase())).length;
}

function renderFoodPhotoAssist(){
  const {status,box}=smartFoodElements();if(!status||!box)return;
  status.textContent='已判断为普通食物照片。请确认食物名称，系统再联网估算营养；照片无法准确判断重量和烹调用油。';
  box.innerHTML=`<div class="food-search-row"><input id="photoFoodName" placeholder="例如：番茄炒蛋" onkeydown="if(event.key==='Enter')searchFoodPhotoName()"/><button class="bpri" type="button" onclick="searchFoodPhotoName()">继续</button></div>`;
  document.getElementById('photoFoodName')?.focus();
}

  const value=String(document.getElementById('photoFoodName')?.value||'').trim();
  const main=document.getElementById('smartFoodQuery');if(main)main.value=value;
  searchOnlineFoods(value);
}

async function smartFoodPhoto(file){
  if(!file)return;
  const {status,box}=smartFoodElements(),preview=document.getElementById('smartPreview');
  if(!status||!box)return;
  const previewUrl=URL.createObjectURL(file);preview.src=previewUrl;preview.style.display='block';box.innerHTML='';
  status.textContent='正在判断照片类型…';
  const barcode=await detectBarcodeInPhoto(file);
  if(barcode&&await lookupBarcode(barcode)){URL.revokeObjectURL(previewUrl);return;}
  status.textContent='正在通过腾讯云 AI 识别食物、条码或营养表…';
  try{
    const imageDataUrl=await fileToAiDataUrl(file);
    useFoodAiResponse(await callFoodAi({imageDataUrl,fileName:String(file.name||'photo').slice(0,120)}));
    URL.revokeObjectURL(previewUrl);return;
  }catch(e){
    status.textContent=`${e.message} 正在改用本地识别…`;
  }
  await smartFoodPhotoFallback(file,previewUrl);
}

async function smartFoodPhotoFallback(file,previewUrl){
  const {status}=smartFoodElements();
  status.textContent='未发现条码，正在检查是否为营养成分表…首次使用可能需要几十秒。';
  let worker=null;
  try{
    const T=await ensureTesseract();
    worker=await T.createWorker(['chi_sim','eng'],1,{logger:m=>{if(m.status==='recognizing text')status.textContent=`正在分析照片… ${Math.round((m.progress||0)*100)}%`;}});
    const ret=await worker.recognize(file,{rotateAuto:true});
    const rawText=normalizeOcrText(ret.data.text);
    const ocrBarcode=(rawText.match(/(?:^|\D)(\d{8,14})(?:\D|$)/)||[])[1]||'';
    if(ocrBarcode){await lookupBarcode(ocrBarcode);return;}
    const draft=parseNutritionLabel(rawText);
    if(nutritionTextScore(rawText)>=2&&(draft.c||draft.f||draft.p||draft.k)){
      status.textContent='已判断为营养成分表，并提取了数据。请逐项核对包装后再保存。';
      renderFoodEditor(draft,'');return;
    }
    renderFoodPhotoAssist();
  }catch(e){
    renderFoodPhotoAssist();
    status.textContent='没有读到条码或营养表，已按普通食物照片处理。请确认名称后继续。';
  }finally{URL.revokeObjectURL(previewUrl);try{await worker?.terminate();}catch(e){}}
}

async function scanBarcodePhoto(file){return smartFoodPhoto(file);}
async function recognizeNutritionPhoto(file){return smartFoodPhoto(file);}

function updateFoodEnergyHint(){

  const el=document.getElementById('foodEnergyHint');if(el)el.textContent=`三大营养素换算热量约 ${Math.round(c*4+f*9+p*4)} kcal；包装标签可能因纤维和四舍五入略有不同。`;
}

function clearFoodForm(){renderFoodEditor();}

function showFoodFormError(message){
  const el=document.getElementById('foodFormError');if(!el)return;
  el.textContent=message;el.style.display=message?'block':'none';
}

function saveCustomFood(){
  const originalName=window._editingFoodName||'';
  const name=String(document.getElementById('cf-name')?.value||'').trim().replace(/[<>]/g,'').slice(0,80);
  const c=+document.getElementById('cf-c')?.value,f=+document.getElementById('cf-f')?.value,p=+document.getElementById('cf-p')?.value,k=+document.getElementById('cf-k')?.value;
  const u=document.getElementById('cf-unit')?.value==='ml'?'ml':'g';
  const cat=document.getElementById('cf-cat')?.value||inferFoodCategory(c,f,p);
  let raw=String(document.getElementById('cf-raw')?.value||'').trim().slice(0,120);
  if(!raw||/^自定义\/每100(?:g|ml)$/.test(raw))raw=`自定义/每100${u}`;
  if(!name){showFoodFormError('请填写食物名称。');return;}
  if([c,f,p,k].some(v=>!Number.isFinite(v)||v<0)){showFoodFormError('请完整填写碳水、脂肪、蛋白质和热量，数值不能小于0。');return;}
  if(c>100||f>100||p>100){showFoodFormError(`每100${u}的单项营养不能超过100克。`);return;}
  if(DB[name]&&name!==originalName){showFoodFormError('这个名称已经存在，请换一个名称，或在下方直接编辑原食物。');return;}
  const record={name,c,f,p,k,cat,u,raw,custom:1,source:window._foodDraftSource||'手动录入',sourceId:window._foodDraftSourceId||'',savedAt:new Date().toISOString()};
  if(originalName&&originalName!==name&&DB[originalName]?.custom)delete DB[originalName];
  const oldIndex=customFoods.findIndex(x=>x.name===originalName||x.name===name);
  if(oldIndex>=0)customFoods[oldIndex]=record;else customFoods.push(record);
  DB[name]={...record};refreshFoodNames();
  if(!saveCustomFoods())return;
  finishFoodSave(name,originalName);
}

function finishFoodSave(name,oldName=''){
  if(oldName&&oldName!==name){
    meals.forEach(day=>day.forEach(meal=>meal.forEach(it=>{if(it.n===oldName)it.n=name;})));
    pantryFoods=pantryFoods.map(list=>list.map(n=>n===oldName?name:n));
    const templates=loadMealTemplates();
    Object.values(templates).forEach(pack=>Object.values(pack||{}).forEach(list=>(list||[]).forEach(tpl=>(tpl.meals||[]).forEach(meal=>(meal||[]).forEach(it=>{if(it.n===oldName)it.n=name;})))));
    saveMealTemplates(templates);
  }
  const ctx=foodHubContext;
  if(ctx?.kind==='pantry'){
    pantryFoods[ctx.di]=[...new Set([...(pantryFoods[ctx.di]||[]),name])];
    closeModal();renderDetail();return;
  }
  if(ctx?.kind==='meal'){
    const {di,mi}=ctx;closeModal();openModal(di,mi,name);return;
  }
  renderSmartFoodHome(`“${name}”已保存到我的食物库。`);
}

function renderCustomFoodLibrary(){
  const box=document.getElementById('customFoodLibrary');if(!box)return;
  const list=customFoods.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
  box.innerHTML=`<div class="food-library-head"><div class="food-library-title">我的食物（${list.length}）</div><div class="food-library-tools"><button class="mini-btn" type="button" onclick="exportCustomFoods()">导出</button><label class="mini-btn">导入<input type="file" accept="application/json,.json" style="display:none" onchange="importCustomFoods(this.files[0])"/></label></div></div>`+
    (list.length?`<div class="custom-food-list">${list.map((x,i)=>`<div class="custom-food-row"><div class="custom-food-main"><div class="custom-food-name">${escapeHtml(x.name)}</div><div class="custom-food-meta">每100${x.u} · ${Math.round(x.k)}kcal · 碳${x.c} 脂${x.f} 蛋${x.p}</div></div><div class="custom-food-btns"><button class="mini-btn" type="button" onclick="editCustomFoodAt(${i})">编辑</button><button class="mini-btn" type="button" onclick="deleteCustomFoodAt(${i})">删除</button></div></div>`).join('')}</div>`:'<div class="custom-food-empty">还没有自己的食物，保存后会出现在这里。</div>');
  window._sortedCustomFoods=list;
}

function editCustomFoodAt(i){const x=(window._sortedCustomFoods||[])[i];if(x)renderFoodEditor(x,x.name);}
function templatesUseFood(name){
  const data=loadMealTemplates();
  return Object.values(data).some(pack=>Object.values(pack||{}).some(list=>(list||[]).some(tpl=>(tpl.meals||[]).some(meal=>(meal||[]).some(it=>it.n===name)))));
}
function deleteCustomFoodAt(i){
  const x=(window._sortedCustomFoods||[])[i];if(!x)return;
  const inUse=meals.some(day=>day.some(meal=>meal.some(it=>it.n===x.name)))||templatesUseFood(x.name);
  if(inUse){alert('这个食物正在当前餐单或已保存模板中使用，请先移除后再删除。');return;}
  if(!confirm(`确定删除“${x.name}”吗？`))return;
  customFoods=customFoods.filter(y=>y.name!==x.name);delete DB[x.name];refreshFoodNames();
  pantryFoods=pantryFoods.map(list=>list.filter(n=>n!==x.name));saveCustomFoods();renderCustomFoodLibrary();
}

function exportCustomFoods(){
  const payload={version:1,exportedAt:new Date().toISOString(),foods:customFoods};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`BENLEE-食物库-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function importCustomFoods(file){
  if(!file)return;
  try{
    const json=JSON.parse(await file.text());const rows=Array.isArray(json)?json:json.foods;
    if(!Array.isArray(rows))throw new Error('invalid');
    let added=0,updated=0,skipped=0;
    rows.forEach(raw=>{
      const name=String(raw?.name||'').trim().replace(/[<>]/g,'').slice(0,80);
      const nums=[+raw?.c,+raw?.f,+raw?.p,+raw?.k];
      if(!name||nums.some(v=>!Number.isFinite(v)||v<0)||nums.slice(0,3).some(v=>v>100)||BUILTIN_FOOD_NAMES.includes(name)){skipped++;return;}
      const record={name,c:nums[0],f:nums[1],p:nums[2],k:nums[3],cat:['carb','prot','fat','veg','oil'].includes(raw.cat)?raw.cat:inferFoodCategory(...nums.slice(0,3)),u:raw.u==='ml'?'ml':'g',raw:String(raw.raw||'导入/每100g').slice(0,120),custom:1,source:String(raw.source||'导入').slice(0,80),sourceId:String(raw.sourceId||'').slice(0,100),savedAt:raw.savedAt||new Date().toISOString()};
      const idx=customFoods.findIndex(x=>x.name===name);if(idx>=0){customFoods[idx]=record;updated++;}else{customFoods.push(record);added++;}
      DB[name]={...record};
    });
    refreshFoodNames();saveCustomFoods();renderCustomFoodLibrary();alert(`导入完成：新增 ${added}，更新 ${updated}，跳过 ${skipped}。`);
  }catch(e){alert('导入失败：请选择由本页面导出的食物库 JSON 文件。');}
}

function closeModal(){document.getElementById('ov').classList.remove('open');document.querySelector('#ov .modal').classList.remove('wide');_mc=null;window._pantryDraft=null;window._editingFoodName='';window._foodDraftSource='';window._foodDraftSourceId='';foodHubContext=null;}

document.getElementById('ov').onclick=e=>{if(e.target===document.getElementById('ov'))closeModal();};

const profiles=loadProfiles();
fillProfile(profiles[0]||defaultProfiles()[0]);
renderProfiles();
applyTrainingPlan();selectDay(+document.getElementById('startDay').value||0);

syncStickyOffset();

if(window.ResizeObserver)new ResizeObserver(syncStickyOffset).observe(document.querySelector('.hd'));
